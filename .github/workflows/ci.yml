name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate the Claude Code plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@latest plugin validate ./plugin
          npx --yes @anthropic-ai/claude-code@latest plugin validate .
